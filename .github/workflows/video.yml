name: Make video
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: short or long
        default: short
      upload:
        description: Upload to YouTube (true or false)
        default: "true"
      topic:
        description: Topic (blank = first line of topics.txt)
        required: false
permissions:
  contents: write
concurrency: video-run
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: python make_video.py "${{ inputs.topic }}" "${{ inputs.mode || (github.event.schedule == '0 18 * * *' && 'long' || 'short') }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - if: ${{ inputs.upload != 'false' }}
        run: python upload.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: |
          git config user.name maskpocket
          git config user.email maskpocket@users.noreply.github.com
          git add used_topics.txt
          git diff --cached --quiet || (git commit -qm "Record topic" && git pull -q --rebase && git push -q)
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out/video.mp4 }
      - uses: actions/upload-artifact@v4
        with: { name: meta, path: out/meta.json }
